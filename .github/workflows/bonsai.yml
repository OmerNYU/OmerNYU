name: Grow Git Bonsai

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Grow bonsai
        uses: egorthinks/git-bonsai@v1
        with:
          user: OmerNYU
          output-dir: output
          season: auto
          commit: true
          commit-message: "chore: tend the bonsai 🌳"
